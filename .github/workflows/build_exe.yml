name: Compilar Executavel Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Rodar testes antes do build
        run: |
          pip install pytest
          python -m pytest -q

      - name: Gerar Executavel Windows (.exe)
        run: |
          pyinstaller --noconfirm --onedir --add-data "templates;templates" --collect-all openai --collect-all dotenv --collect-all docx --hidden-import=dotenv --hidden-import=pandas --hidden-import=openpyxl --hidden-import=python_calamine --name "Automacao_Relatorio_Rastreio" app.py

      - name: Disponibilizar arquivo para Download
        uses: actions/upload-artifact@v4
        with:
          name: Automacao_Relatorio_Rastreio_Windows
          path: dist/Automacao_Relatorio_Rastreio/