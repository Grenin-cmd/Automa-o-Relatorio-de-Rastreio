name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flask pandas python-docx openpyxl pyinstaller

      - name: Limpar arquivos antigos
        shell: powershell
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Force AnalisadorRastreio.spec -ErrorAction SilentlyContinue

      - name: Gerar o .exe
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm --onefile --name AnalisadorRastreio --add-data "templates;templates" app.py

      - name: Verificar .exe
        shell: powershell
        run: |
          Write-Host "=== EXE GERADO ==="
          Get-Item "dist\AnalisadorRastreio.exe" | Select-Object Name, Length, LastWriteTime

      - name: Publicar o .exe pronto
        uses: actions/upload-artifact@v4
        with:
          name: AnalisadorRastreio-windows-novo
          path: dist/AnalisadorRastreio.exe
