<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Análise Inteligente de Frotas</title>
<style>
  :root { --ink: #172033; --muted: #6b7280; --line: #d9e0ea; --soft: #f4f7fb; --accent: #6d3df5; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #f7f9fc, #eef2f8); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
  .login { width: min(420px, calc(100% - 32px)); background: #fff; border: 1px solid var(--line); padding: 38px; box-shadow: 0 18px 50px rgba(23, 32, 51, .08); }
  h1 { margin: 0 0 8px; font-size: 1.55rem; }
  p { color: var(--muted); margin: 0 0 28px; font: .86rem/1.5 Arial, sans-serif; }
  label { display: block; margin: 16px 0 6px; font: 700 .75rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  input { width: 100%; padding: 12px; border: 1px solid var(--line); font: .95rem Arial, sans-serif; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: 0; background: var(--ink); color: #fff; cursor: pointer; font: 700 .86rem Arial, sans-serif; }
  .flash { padding: 10px 12px; background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; font: .82rem Arial, sans-serif; }
</style>
</head>
<body>
  <main class="login">
    <h1>Análise Inteligente de Frotas</h1>
    <p>Acesse sua conta para continuar.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
