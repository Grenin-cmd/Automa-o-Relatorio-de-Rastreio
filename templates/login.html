<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Análise de Frotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #0f172a; color: #0f172a; font: 14px/1.5 'Plus Jakarta Sans', system-ui, sans-serif; }
  .caixa { width: min(400px, 100%); background: #fff; border-radius: 20px; padding: 34px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; font-weight: 700; font-size: 16px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: #7c3aed; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: #64748b; }
  label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 11px; font: 14px 'Plus Jakarta Sans', sans-serif; }
  input:focus { outline: 2px solid #ddd6fe; border-color: #7c3aed; }
  button { width: 100%; margin-top: 22px; min-height: 46px; border: 0; border-radius: 12px; background: #7c3aed; color: #fff; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  button:hover { background: #6d28d9; }
  .aviso { padding: 10px 12px; border-radius: 10px; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>
  <main class="caixa">
    <div class="marca"><span class="logo">AF</span>Análise de Frotas</div>
    <h1>Bem-vindo</h1>
    <p>Acesse sua conta para continuar.</p>
    {% with mensagens = get_flashed_messages(with_categories=true) %}{% for c, m in mensagens %}<div class="aviso">{{ m }}</div>{% endfor %}{% endwith %}
    <form method="post">{{ csrf_input() }}
      <label for="nome">Nome</label><input id="nome" name="nome" autocomplete="username" required autofocus>
      <label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
